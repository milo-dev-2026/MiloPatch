          // 视图树 dump: 打开页面时打印层级(类名+文字+frame), 用于精准定位
          static void DumpView(UIView *v, int depth, NSMutableString *out) {
              @try {
                  if (depth > 14 || out.length > 40000) return;
                  NSString *cls = NSStringFromClass([v class]);
                  NSMutableString *line = [NSMutableString string];
                  for (int i = 0; i < depth; i++) [line appendString:@" "];
                  [line appendFormat:@"%@ [%d,%d %dx%d]%@", cls,
                      (int)v.frame.origin.x, (int)v.frame.origin.y, (int)v.frame.size.width, (int)v.frame.size.height,
                      v.hidden ? @" HIDDEN" : @""];
                  if ([v isKindOfClass:[UILabel class]]) {
                      NSString *t = ((UILabel *)v).text;
                      if (t.length) [line appendFormat:@" txt=\"%@\"", t];
                  } else if ([v isKindOfClass:[UIButton class]]) {
                      NSString *t = [(UIButton *)v titleForState:0];
                      if (t.length) [line appendFormat:@" btn=\"%@\"", t];
                      id img = [(UIButton *)v imageForState:0];
                      if (img) [line appendFormat:@" img=%@", img];
                  } else if ([v isKindOfClass:[UIImageView class]]) {
                      id img = [(UIImageView *)v image];
                      if (img) [line appendFormat:@" ivimg=%@", img];
                  }
                  if (v.accessibilityIdentifier.length) [line appendFormat:@" aid=%@", v.accessibilityIdentifier];
                  [out appendFormat:@"%@\n", line];
                  for (UIView *sv in v.subviews) DumpView(sv, depth + 1, out);
              } @catch (NSException *e) {}
          }
