          static void TraceClass(NSString *clsName) {
              Class c = objc_getClass(clsName.UTF8String);
              if (!c) { LOGE([NSString stringWithFormat:@"traceclass %@ absent", clsName]); return; }
              if (!g_origMap) g_origMap = [NSMutableDictionary dictionary];
              if (!g_descMap) g_descMap = [NSMutableDictionary dictionary];
              NSArray *skip = SkipSels();
              void *imps[8] = { (void *)h_g0, (void *)h_g1, (void *)h_g2, (void *)h_g3, (void *)h_g4, (void *)h_g5, (void *)h_g6, (void *)h_g7 };
              unsigned int mc = 0;
              Method *ms = class_copyMethodList(c, &mc);
              int hooked = 0;
              for (unsigned int i = 0; i < mc; i++) {
                  SEL sel = method_getName(ms[i]);
                  NSString *sn = NSStringFromSelector(sel);
                  if ([skip containsObject:sn]) continue;
                  if (g_origMap[MapKey(c, sel)]) continue;
                  int na = (int)method_getNumberOfArguments(ms[i]) - 2;
                  if (na < 0 || na > 7) continue;
                  char rt[32]; method_getReturnType(ms[i], rt, sizeof(rt));
                  if (!TypeCharSafe(rt[0])) continue;
                  BOOL badArg = NO;
                  for (int a = 2; a < na + 2; a++) {
                      char at[64]; method_getArgumentType(ms[i], a, at, sizeof(at));
                      if (!TypeCharSafe(at[0])) { badArg = YES; break; }
                  }
                  if (badArg) continue;
                  if (na >= 1) {
                      char at1[64]; method_getArgumentType(ms[i], 2, at1, sizeof(at1));
                      if (at1[0] == '@') g_descMap[MapKey(c, sel)] = @YES;
                  }
                  IMP orig = method_getImplementation(ms[i]);
                  if (orig == (IMP)imps[na]) continue;
                  g_origMap[MapKey(c, sel)] = [NSValue valueWithPointer:orig];
                  method_setImplementation(ms[i], (IMP)imps[na]);
                  hooked++;
              }
              if (ms) free(ms);
              LOGE([NSString stringWithFormat:@"traceclass %@ hooked=%d", clsName, hooked]);
          }
          static NSString *RelPathFromData(id data) {
              id extra = nil;
              @try { extra = [data valueForKey:@"extraData"]; } @catch (NSException *e) {}
              id msg = nil;
              if ([extra isKindOfClass:[NSDictionary class]]) msg = [(NSDictionary *)extra objectForKey:@"message"];
              if (!msg && extra) msg = extra;
              if (!msg) return nil;
              id cont = nil;
              @try { cont = [msg valueForKey:@"content"]; } @catch (NSException *e) {}
              if (!cont) return nil;
              for (NSString *k in @[@"remoteUrl", @"url"]) {
                  id v = nil;
                  @try { v = [cont valueForKey:k]; } @catch (NSException *e) {}
                  if ([v isKindOfClass:[NSString class]] && [v hasPrefix:@"file/preview/"]) return v;
              }
              return nil;
          }
          static void FixMediaData(id data, NSString *tag) {
              if (!data) return;
              NSString *rel = RelPathFromData(data);
              if (!rel) { LOGE([NSString stringWithFormat:@"%@ skip norel", tag]); return; }
              NSString *full = [NSString stringWithFormat:@"http://101.35.120.27:8090/milo/%@", [rel substringFromIndex:13]];
              NSURL *u = [NSURL URLWithString:full];
              if (!u) return;
              for (NSString *pk in @[@"videoURL", @"imageURL"]) {
                  id cur = nil;
                  @try { cur = [data valueForKey:pk]; } @catch (NSException *e) { continue; }
                  if (!cur) {
                      @try { [data setValue:u forKey:pk]; LOGE([NSString stringWithFormat:@"%@ fixed %@=%@", tag, pk, full]); }
                      @catch (NSException *e) {}
                  }
              }
          }
