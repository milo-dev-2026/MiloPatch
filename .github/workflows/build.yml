              int n = objc_getClassList(NULL, 0);
              Class *cs = (Class *)malloc(sizeof(Class) * n);
              n = objc_getClassList(cs, n);
              int hooked = 0;
              for (int i = 0; i < n; i++) {
                  const char *img = class_getImageName(cs[i]);
                  if (!img || (!strstr(img, "FayChat") && !strstr(img, "FAMainModule") && !strstr(img, "FALiteVideo") && !strstr(img, "ffmpegkit"))) continue;
                  Method m = FindOwnMethod(cs[i], sel);
                  if (!m) continue;
                  int na = (int)method_getNumberOfArguments(m) - 2;
                  if (na != arity || na < 0 || na > 7) { LOGE([NSString stringWithFormat:@"selhook %s sig-mismatch na=%d", sel_getName(sel), na]); continue; }
                  char rt[32]; method_getReturnType(m, rt, sizeof(rt));
                  if (!TypeCharSafe(rt[0])) continue;
                  BOOL badArg = NO;
                  for (int a = 2; a < na + 2; a++) { char at[64]; method_getArgumentType(m, a, at, sizeof(at)); if (!TypeCharSafe(at[0])) { badArg = YES; break; } }
                  if (badArg) continue;
                  if (na >= 1) { char at1[64]; method_getArgumentType(m, 2, at1, sizeof(at1)); if (at1[0] == '@') g_descMap[MapKey(cs[i], sel)] = @YES; }
                  if (g_origMap[MapKey(cs[i], sel)]) continue;
                  IMP orig = method_getImplementation(m);
                  if (orig == (IMP)imps[na]) continue;
                  g_origMap[MapKey(cs[i], sel)] = [NSValue valueWithPointer:orig];
                  method_setImplementation(m, (IMP)imps[na]);
                  hooked++;
                  LOGE([NSString stringWithFormat:@"selhook %s -> %s", sel_getName(sel), class_getName(cs[i])]);
              }
              free(cs);
              if (!hooked) LOGE([NSString stringWithFormat:@"selhook %s no-impl", sel_getName(sel)]);
          }
