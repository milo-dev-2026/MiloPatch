          // 递归查找 WKContactsVC 并触发 requestData(等价于用户点一下好友页)
          static int MiloScanVC17(id vc, int depth) {
              if (!vc || depth > 8) return 0;
              int hits = 0;
              @try {
                  if ([[[vc class] description] isEqualToString:@"WKContactsVC"]) {
                      SEL rd = sel_registerName("requestData");
                      if ([vc respondsToSelector:rd]) {
                          ((void(*)(id, SEL))objc_msgSend)(vc, rd);
                          hits++;
                      }
                  }
                  SEL cs = sel_registerName("childViewControllers");
                  if ([vc respondsToSelector:cs]) {
                      id arr = ((id(*)(id, SEL))objc_msgSend)(vc, cs);
                      if ([arr isKindOfClass:[NSArray class]]) {
                          for (id c in (NSArray *)arr) hits += MiloScanVC17(c, depth + 1);
                      }
                  }
                  SEL ps = sel_registerName("presentedViewController");
                  if ([vc respondsToSelector:ps]) {
                      id p = ((id(*)(id, SEL))objc_msgSend)(vc, ps);
                      if (p) hits += MiloScanVC17(p, depth + 1);
                  }
              } @catch (NSException *e) {}
              return hits;
          }
