                      // ---- 修复: size=0 导致 imageURL 未构建, 从 remoteUrl 现场拼绝对地址 ----
                      NSString *rurl = nil;
                      if (cont) { @try { rurl = [cont valueForKey:@"remoteUrl"]; } @catch (NSException *e) {} }
                      if ([rurl isKindOfClass:[NSString class]] && [rurl hasPrefix:@"file/preview/"]) {
                          NSString *key = [rurl substringFromIndex:13];
                          NSString *full = [NSString stringWithFormat:@"http://101.35.120.27:8090/milo/%@", key];
                          NSURL *absu = [NSURL URLWithString:full];
                          if (absu) {
