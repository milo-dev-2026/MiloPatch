          static BOOL MiloRemoveRowForLabel(UILabel *l) {
              @try {
                  UIView *p = l;
                  UITableViewCell *cell = nil;
                  UITableView *tv = nil;
                  for (int i = 0; i < 9 && p; i++) {
                      p = p.superview;
                      if ([p isKindOfClass:[UITableViewCell class]]) cell = (UITableViewCell *)p;
                      if ([p isKindOfClass:[UITableView class]]) { tv = (UITableView *)p; break; }
                  }
                  if (!tv || !cell) return NO;
                  NSIndexPath *ip = [tv indexPathForCell:cell];
                  if (!ip) return NO;
                  UIResponder *r = tv;
                  while (r && ![r isKindOfClass:[UIViewController class]]) r = r.nextResponder;
                  if (!r) return NO;
                  id items = [r valueForKey:@"items"];
                  if (![items isKindOfClass:[NSArray class]]) return NO;
                  if (ip.section >= [(NSArray *)items count]) return NO;
                  id sec = [(NSArray *)items objectAtIndex:ip.section];
                  id rows = [sec respondsToSelector:@selector(items)] ? [sec valueForKey:@"items"] : nil;
                  if (![rows isKindOfClass:[NSMutableArray class]] && ![rows isKindOfClass:[NSArray class]]) return NO;
                  if (ip.row >= [(NSArray *)rows count]) return NO;
                  NSMutableArray *mr = [NSMutableArray arrayWithArray:(NSArray *)rows];
                  [mr removeObjectAtIndex:ip.row];
                  if ([sec respondsToSelector:@selector(setItems:)]) [sec performSelector:@selector(setItems:) withObject:mr];
                  [tv reloadData];
                  LOGE([NSString stringWithFormat:@"RE12 row removed 标签 %@ sec=%ld row=%ld", NSStringFromClass([r class]),
                        (long)ip.section, (long)ip.row]);
                  return YES;
              } @catch (NSException *e) { LOGE(@"RE12 row remove ERR"); }
              return NO;
          }
