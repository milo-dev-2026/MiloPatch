          // 过滤 section 的嵌套数组, 删除标题被屏蔽的 item, 返回是否有变化
          static BOOL MeFilterSection(id sec) {
              BOOL any = NO;
              @try {
                  Class k = [sec class];
                  while (k && k != [NSObject class]) {
                      unsigned int ic = 0;
                      Ivar *ivs = class_copyIvarList(k, &ic);
                      for (unsigned int i = 0; i < ic; i++) {
