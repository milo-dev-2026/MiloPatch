                      contextArg ? NSStringFromClass([contextArg class]) : @"(nil)",
                      ca.length > 300 ? [ca substringToIndex:300] : ca]);
                  if (!videoArg || ([videoArg isKindOfClass:[NSString class]] && [videoArg length] < 5)) {
                      LOGE(@"svm-WARN videoArg is nil or too short!");
