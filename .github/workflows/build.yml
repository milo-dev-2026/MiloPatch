          static void StartDL(id self, SEL _cmd, IMP o, NSURL *url, NSString *key, id fallbackAsset) {
              NSString *local = MiloLocalVideoPath(key);
              __weak id weakSelf = self;
              SEL cmdCap = _cmd;
              [[[NSURLSession sharedSession] downloadTaskWithURL:url completionHandler:^(NSURL *loc, NSURLResponse *resp, NSError *err) {
                  id sself = weakSelf;
                  NSInteger sc = [resp isKindOfClass:[NSHTTPURLResponse class]] ? [(NSHTTPURLResponse *)resp statusCode] : 200;
                  if (loc && !err && sc >= 200 && sc < 300) {
                      @try {
                          [[NSFileManager defaultManager] removeItemAtPath:local error:nil];
                          [[NSFileManager defaultManager] moveItemAtURL:loc toURL:[NSURL fileURLWithPath:local] error:nil];
                      } @catch (NSException *e) {}
                      [PendingDLViews() removeObject:sself];
                      if (sself) dispatch_async(dispatch_get_main_queue(), ^{
                          id la = [objc_getClass("AVURLAsset") assetWithURL:[NSURL fileURLWithPath:local]];
                          LOGE([NSString stringWithFormat:@"FAV dl-ok key=%@ -> local", key]);
                          ((void(*)(id, SEL, id))o)(sself, cmdCap, la);
                      });
                  } else {
                      LOGE([NSString stringWithFormat:@"FAV dl-err key=%@ sc=%ld err=%@", key, (long)sc, err]);
                      if ([[url host] rangeOfString:@"myqcloud.com"].location != NSNotFound) {
                          NSString *gw = [NSString stringWithFormat:@"http://101.35.120.27:8090/milo%@", [url path]];
                          LOGE([NSString stringWithFormat:@"FAV dl-retry gw key=%@", key]);
                          StartDL(self, cmdCap, o, [NSURL URLWithString:gw], key, fallbackAsset);
                          return;
                      }
                      [PendingDLViews() removeObject:sself];
                      if (sself) dispatch_async(dispatch_get_main_queue(), ^{
                          ((void(*)(id, SEL, id))o)(sself, cmdCap, fallbackAsset);
                      });
                  }
              }] resume];
          }
