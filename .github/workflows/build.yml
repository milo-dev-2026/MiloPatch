          // ===== brand10: 页面结构/输入框/数据 全量采集 + 第二批修复 =====
          static NSString *ObjBrief(id v, NSUInteger maxLen) {
              if (!v) return @"nil";
              @try {
                  if ([v isKindOfClass:[NSString class]]) {
                      NSString *s = (NSString *)v;
                      return [NSString stringWithFormat:@"\"%@\"", s.length > maxLen ? [s substringToIndex:maxLen] : s];
                  }
                  if ([v isKindOfClass:[NSNumber class]]) return [v description];
                  return NSStringFromClass([v class]);
              } @catch (NSException *e) { return @"?"; }
          }
          static NSString *IvarDumpString(id obj) {
              NSMutableString *sb = [NSMutableString string];
              @try {
                  const char *base = (const char *)(__bridge void *)obj;
                  Class k = [obj class];
                  int guard = 0;
                  while (k && k != [NSObject class] && guard++ < 8) {
                      unsigned int ic = 0;
                      Ivar *ivs = class_copyIvarList(k, &ic);
                      for (unsigned int i = 0; i < ic && sb.length < 5000; i++) {
                          const char *nm = ivar_getName(ivs[i]);
                          const char *te = ivar_getTypeEncoding(ivs[i]);
                          if (!nm || !te) continue;
                          ptrdiff_t off = ivar_getOffset(ivs[i]);
                          if (te[0] == '@') {
                              id v = object_getIvar(obj, ivs[i]);
                              if (!v) continue;
                              if ([v isKindOfClass:[NSArray class]] && [(NSArray *)v count] <= 20) {
                                  NSMutableString *b = [NSMutableString stringWithFormat:@"%@[", NSStringFromClass([v class])];
                                  for (id it in (NSArray *)v) [b appendFormat:@"%@,", NSStringFromClass([it class])];
                                  [b appendString:@"]"];
                                  [sb appendFormat:@"%s=%@ ", nm, b];
                              } else if ([v isKindOfClass:[NSDictionary class]] && [(NSDictionary *)v count] <= 10) {
                                  [sb appendFormat:@"%s=%@ ", nm, ObjBrief([(NSDictionary *)v description], 160)];
                              } else {
                                  [sb appendFormat:@"%s=%@ ", nm, ObjBrief(v, 40)];
                              }
                          } else {
                              long long n = 0;
                              switch (te[0]) {
                                  case 'q': n = *(long long *)(base + off); break;
                                  case 'Q': n = (long long)*(unsigned long long *)(base + off); break;
                                  case 'i': n = *(int *)(base + off); break;
                                  case 'I': n = *(unsigned int *)(base + off); break;
                                  case 's': n = *(short *)(base + off); break;
                                  case 'S': n = (long long)*(unsigned short *)(base + off); break;
                                  case 'c': n = *(char *)(base + off); break;
                                  case 'B': n = *(signed char *)(base + off) ? 1 : 0; break;
                                  default: continue;
                              }
                              NSString *low = [[NSString stringWithUTF8String:nm] lowercaseString];
                              if ([low containsString:@"len"] || [low containsString:@"max"] || [low containsString:@"num"] ||
                                  [low containsString:@"digit"] || [low containsString:@"count"] || [low containsString:@"size"] ||
                                  [low containsString:@"limit"]) {
                                  [sb appendFormat:@"%s=%lld ", nm, n];
                              }
                          }
                      }
                      if (ivs) free(ivs);
                      k = class_getSuperclass(k);
                  }
              } @catch (NSException *e) {}
              return sb;
          }
