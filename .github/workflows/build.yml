          static id h_ud_get(id self, SEL _cmd, NSString *key) {
              id v = ((id(*)(id, SEL, id))g_udOrig)(self, _cmd, key);
              @try {
                  if (g_cfgLog < 400 && [key isKindOfClass:[NSString class]] && ![key isEqualToString:@"flame_second"]) {
