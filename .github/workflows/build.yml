name: build-tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld

      - name: Fetch iOS SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: sdks
          sparse-checkout: |
            iPhoneOS16.5.sdk

      - name: Write hook source
        run: |
          cat > hook.m << 'OBJC'
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>

          static NSArray *BlockTitles(void) {
              static NSArray *a;
              static dispatch_once_t once;
              dispatch_once(&once, ^{
                  a = @[@"我的道具", @"道具商城", @"会员中心", @"网页登录", @"分享邀请", @"域名配置"];
              });
              return a;
          }

          static BOOL Hit(NSString *t) {
              if (![t isKindOfClass:[NSString class]] || t.length == 0) return NO;
              for (NSString *b in BlockTitles()) if ([t containsString:b]) return YES;
              return NO;
          }

          static id IvarOf(id obj, const char *name) {
              Ivar iv = class_getInstanceVariable([obj class], name);
              return iv ? object_getIvar(obj, iv) : nil;
          }

          static void (*o_hdr_layout)(id, SEL);
          static void h_hdr_layout(id self, SEL _cmd) {
              o_hdr_layout(self, _cmd);
              UIView *coin = IvarOf(self, "_ucoinCardView");
              UIView *member = IvarOf(self, "_membershipCardView");
              if ([coin isKindOfClass:[UIView class]]) { coin.hidden = YES; coin.alpha = 0; }
              if ([member isKindOfClass:[UIView class]]) { member.hidden = YES; member.alpha = 0; }
          }

          static void (*o_cell_layout)(id, SEL);
          static void h_cell_layout(id self, SEL _cmd) {
              o_cell_layout(self, _cmd);
              UILabel *lbl = IvarOf(self, "_titleLbl");
              if ([lbl isKindOfClass:[UILabel class]] && Hit(lbl.text)) {
                  UIView *v = (UIView *)self;
                  v.hidden = YES;
                  v.alpha = 0;
                  v.userInteractionEnabled = NO;
              }
          }

          static void (*o_tcell_layout)(id, SEL);
          static void h_tcell_layout(id self, SEL _cmd) {
              o_tcell_layout(self, _cmd);
              UITableViewCell *c = (UITableViewCell *)self;
              UILabel *tl = c.textLabel;
              if ([tl isKindOfClass:[UILabel class]] && Hit(tl.text)) {
                  c.hidden = YES;
                  c.alpha = 0;
                  c.userInteractionEnabled = NO;
              }
          }

          static void (*o_vip_dmw)(id, SEL);
          static void h_vip_dmw(id self, SEL _cmd) {
              o_vip_dmw(self, _cmd);
              UIView *v = (UIView *)self;
              if (!v.hidden) { v.hidden = YES; v.alpha = 0; }
          }

          static void (*o_login_layout)(id, SEL);
          static void h_login_layout(id self, SEL _cmd) {
              o_login_layout(self, _cmd);
              UIImageView *iv = IvarOf(self, "_iconView");
              if ([iv isKindOfClass:[UIImageView class]]) {
                  NSString *path = [[NSBundle mainBundle] pathForResource:@"milo_logo" ofType:@"png"];
                  UIImage *logo = path ? [UIImage imageWithContentsOfFile:path] : nil;
                  if (logo) iv.image = logo;
              }
          }

          static void (*o_login_appear)(id, SEL, BOOL);
          static void h_login_appear(id self, SEL _cmd, BOOL animated) {
              o_login_appear(self, _cmd, animated);
              UIViewController *vc = (UIViewController *)self;
              vc.navigationItem.rightBarButtonItem = nil;
              vc.navigationItem.rightBarButtonItems = nil;
              vc.navigationItem.leftBarButtonItem = nil;
              vc.navigationItem.leftBarButtonItems = nil;
          }

          static void patch(Class c, SEL sel, void *newImp, void **origImp) {
              if (!c) return;
              Method m = class_getInstanceMethod(c, sel);
              if (!m) return;
              IMP cur = method_getImplementation(m);
              if (cur == (IMP)newImp) return;

              Method own = NULL;
              unsigned int n = 0;
              Method *ms = class_copyMethodList(c, &n);
              for (unsigned int i = 0; i < n; i++) {
                  if (method_getName(ms[i]) == sel) { own = ms[i]; break; }
              }
              free(ms);

              if (own) {
                  *origImp = (void *)method_getImplementation(own);
                  method_setImplementation(own, (IMP)newImp);
              } else {
                  *origImp = (void *)cur;
                  class_addMethod(c, sel, (IMP)newImp, method_getTypeEncoding(m));
              }
          }

          static BOOL IsPayClass(id obj) {
              if (!obj) return NO;
              NSString *n = NSStringFromClass([obj class]);
              if (!n) return NO;
              return [n containsString:@"Vip"] || [n containsString:@"VIP"]
                  || [n containsString:@"Pay"] || [n containsString:@"Purchase"]
                  || [n containsString:@"Recharge"] || [n containsString:@"Purse"]
                  || [n containsString:@"Rights"] || [n containsString:@"Uliao"];
          }

          static void LOGE(NSString *s);
          static void (*o_present)(id, SEL, UIViewController *, BOOL, void (^)(void));
          static void h_present(id self, SEL _cmd, UIViewController *vc, BOOL anim, void (^comp)(void)) {
              @try {
                  NSString *cn = NSStringFromClass([vc class]);
                  NSString *t = nil, *m = nil;
                  if ([vc isKindOfClass:[UIAlertController class]]) {
                      t = ((UIAlertController *)vc).title;
                      m = ((UIAlertController *)vc).message;
                  }
                  BOOL sus = NO;
                  if (t && ([t containsString:@"过期"] || [t containsString:@"清理"] || [t containsString:@"资源"])) sus = YES;
                  if (m && ([m containsString:@"过期"] || [m containsString:@"清理"] || [m containsString:@"资源"])) sus = YES;
                  if (sus) {
                      NSArray *syms = [NSThread callStackSymbols];
                      NSMutableString *stk = [NSMutableString string];
                      for (NSUInteger i = 0; i < MIN(syms.count, 30); i++) [stk appendFormat:@"\n  %@", syms[i]];
                      LOGE([NSString stringWithFormat:@"EXPIRE-ALERT cls=%@ title=%@ msg=%@ stack:%@", cn, t, m, stk]);
                  }
              } @catch (NSException *e) {}
              if (IsPayClass(vc)) return;
              o_present(self, _cmd, vc, anim, comp);
          }

          static void (*o_push)(id, SEL, UIViewController *, BOOL);
          static void h_push(id self, SEL _cmd, UIViewController *vc, BOOL anim) {
              if (IsPayClass(vc)) return;
              o_push(self, _cmd, vc, anim);
          }

          static void (*o_addsub)(id, SEL, UIView *);
          static void h_addsub(id self, SEL _cmd, UIView *v) {
              if (v && IsPayClass(v)) return;
              o_addsub(self, _cmd, v);
          }

          typedef struct { unsigned long reserved; unsigned long size; void *copy; void *dispose; const char *signature; } BD;
          typedef struct { void *isa; int flags; int reserved; void *invoke; BD *descriptor; } BK;

          static void safeCallBlock(void *bp) {
              if (!bp) return;
              BK *b = (BK *)bp;
              if (!b->descriptor || !b->descriptor->signature) return;
              NSMethodSignature *sig = [NSMethodSignature signatureWithObjCTypes:b->descriptor->signature];
              if (!sig) return;
              if (sig.numberOfArguments <= 1) ((__bridge void (^)(void))bp)();
              else ((__bridge void (^)(id))bp)(nil);
          }

          static void h_show1(id self, SEL _cmd, id title, id action) {
              safeCallBlock((__bridge void *)action);
          }

          static void h_show4(id self, SEL _cmd, id title, id subtitle, id types, id action) {
              safeCallBlock((__bridge void *)action);
          }

          static void h_check(id self, SEL _cmd) { }

          static void (*o_show1)(id, SEL, id, id);
          static void (*o_show4)(id, SEL, id, id, id, id);
          static void (*o_check)(id, SEL);

          /* ============ IM 探针 ============ */
          static NSString *PDesc(id o) {
              if (!o) return @"(nil)";
              NSString *s = nil;
              @try { s = [o description]; } @catch (NSException *e) { s = @"(descfail)"; }
              if (![s isKindOfClass:[NSString class]]) s = @"(notstr)";
              if (s.length > 320) s = [s substringToIndex:320];
              return s;
          }
          static NSUInteger PCnt(id o) {
              if (o && [o respondsToSelector:@selector(count)]) return (NSUInteger)[o count];
              return 0;
          }
          static NSMutableArray *g_buf = nil;
          static NSLock *g_lock = nil;

          static void Flush(void) {
              NSString *body = nil;
              if (!g_lock) return;
              [g_lock lock];
              if (g_buf.count) { body = [g_buf componentsJoinedByString:@"\n"]; [g_buf removeAllObjects]; }
              [g_lock unlock];
              if (!body.length) return;
              dispatch_async(dispatch_get_global_queue(0, 0), ^{
                  @autoreleasepool {
                      NSMutableURLRequest *r = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:@"http://101.35.120.27/probe/log"]];
                      r.HTTPMethod = @"POST";
                      r.timeoutInterval = 8;
                      r.HTTPBody = [body dataUsingEncoding:NSUTF8StringEncoding];
                      [[[NSURLSession sharedSession] dataTaskWithRequest:r] resume];
                  }
              });
          }
          static void Flush(void);
          static void LOGE(NSString *s) {
              NSLog(@"[MILOPROBE] %@", s);
              if (!g_lock) return;
              [g_lock lock];
              [g_buf addObject:s];
              NSUInteger n = g_buf.count;
              [g_lock unlock];
              if (n >= 8) Flush();
          }
          static void ScheduleFlush(void) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)2 * NSEC_PER_SEC), dispatch_get_global_queue(0, 0), ^{
                  Flush();
                  ScheduleFlush();
              });
          }
          static const char *kN = "MILOPROBE ";

          static void (*o_recv)(id, SEL, id);
          static void h_recv(id self, SEL _cmd, id pkt) {
              LOGE([NSString stringWithFormat:@"%shandleRecv cls=%@ desc=%@", kN, NSStringFromClass([pkt class]), PDesc(pkt)]);
              o_recv(self, _cmd, pkt);
          }
          static void (*o_ack)(id, SEL, id);
          static void h_ack(id self, SEL _cmd, id pkt) {
              LOGE([NSString stringWithFormat:@"%shandleSendack cls=%@ desc=%@", kN, NSStringFromClass([pkt class]), PDesc(pkt)]);
              o_ack(self, _cmd, pkt);
          }
          static id (*o_rpm)(id, SEL, id);
          static id h_rpm(id self, SEL _cmd, id in) {
              id r = o_rpm(self, _cmd, in);
              LOGE([NSString stringWithFormat:@"%srecvPacketsToMessages in=%lu out=%lu", kN, (unsigned long)PCnt(in), (unsigned long)PCnt(r)]);
              return r;
          }
          static id (*o_fns)(id, SEL, id);
          static id h_fns(id self, SEL _cmd, id in) {
              id r = o_fns(self, _cmd, in);
              LOGE([NSString stringWithFormat:@"%sfilterNeedStore in=%lu out=%lu", kN, (unsigned long)PCnt(in), (unsigned long)PCnt(r)]);
              return r;
          }
          static void (*o_crd)(id, SEL, id);
          static void h_crd(id self, SEL _cmd, id in) {
              LOGE([NSString stringWithFormat:@"%scallRecvMessagesDelegate cnt=%lu", kN, (unsigned long)PCnt(in)]);
              o_crd(self, _cmd, in);
          }
          static void (*o_csd)(id, SEL, id, id);
          static void h_csd(id self, SEL _cmd, id a, id b) {
              // left 极可能是整数而非对象，禁止对其发消息，只按数值打印
              LOGE([NSString stringWithFormat:@"%scallSendackDelegate left=%lu", kN, (unsigned long)(uintptr_t)b]);
              o_csd(self, _cmd, a, b);
          }
          static id (*o_send)(id, SEL, id, BOOL);
          static id h_send(id self, SEL _cmd, id msg, BOOL q) {
              LOGE([NSString stringWithFormat:@"%ssendMessage retry=%d desc=%@", kN, (int)q, PDesc(msg)]);
              return o_send(self, _cmd, msg, q);
          }
          static id (*o_save)(id, SEL, id, id, id, long, id, id, id);
          static id h_save(id self, SEL _cmd, id msg, id ch, id from, long st, id setting, id cmn, id topic) {
              id r = o_save(self, _cmd, msg, ch, from, st, setting, cmn, topic);
              // ret 可能是 BOOL，禁止 PDesc；只按数值打印
              LOGE([NSString stringWithFormat:@"%ssaveMessage ret=%lu status=%ld cmn=%@", kN, (unsigned long)(uintptr_t)r, st, PDesc(cmn)]);
              if (r && msg) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      @try {
                          SEL sel = @selector(callRecvMessagesDelegate:);
                          if ([self respondsToSelector:sel]) {
                              typedef void (*F)(id, SEL, id);
                              ((F)[self methodForSelector:sel])(self, sel, @[msg]);
                          }
                      } @catch (__unused NSException *e) {}
                  });
              }
              return r;
          }
          static NSUInteger PLen(id o) {
              if (o && [o respondsToSelector:@selector(length)]) return (NSUInteger)[o length];
              return 0;
          }
          static id (*o_dec)(id, SEL, id, id, id);
          static id h_dec(id self, SEL _cmd, id data, id key, id iv) {
              id r = o_dec(self, _cmd, data, key, iv);
              LOGE([NSString stringWithFormat:@"%saesDecrypt in=%lu out=%lu keylen=%lu ivlen=%lu", kN,
                    (unsigned long)PLen(data), (unsigned long)PLen(r), (unsigned long)PLen(key), (unsigned long)PLen(iv)]);
              return r;
          }

          static void (*o_hmsgs)(id, SEL, id);
          static void h_hmsgs(id self, SEL _cmd, id in) {
              LOGE([NSString stringWithFormat:@"%shandleMessages cnt=%lu", kN, (unsigned long)PCnt(in)]);
              o_hmsgs(self, _cmd, in);
          }

          static void ShowMarker(void) {
              @try {
                  UIWindow *win = [UIApplication sharedApplication].keyWindow;
                  if (!win && [UIApplication sharedApplication].windows.count) win = [UIApplication sharedApplication].windows.firstObject;
                  if (!win) return;
                  UILabel *lbl = [UILabel new];
                  lbl.text = @"PROBE-RUN";
                  lbl.textColor = [UIColor redColor];
                  lbl.backgroundColor = [UIColor whiteColor];
                  [lbl sizeToFit];
                  [win addSubview:lbl];
                  [win bringSubviewToFront:lbl];
              } @catch (NSException *e) {}
          }

          static void DumpAPI(void) {
              @autoreleasepool {
                  Class cm = objc_getClass("WKChatManager");
                  unsigned int n = 0;
                  Method *ms = class_copyMethodList(cm, &n);
                  LOGE([NSString stringWithFormat:@"MILOPROBE cm=%u methods", n]);
                  for (unsigned int i = 0; i < n; i++) {
                      LOGE([NSString stringWithFormat:@"MILOPROBE cmm %@", NSStringFromSelector(method_getName(ms[i]))]);
                  }
                  free(ms);

                  int cnt = objc_getClassList(NULL, 0);
                  Class *cs = (Class *)malloc(sizeof(Class) * cnt);
                  objc_getClassList(cs, cnt);
                  int wk = 0, sw = 0;
                  for (int i = 0; i < cnt; i++) {
                      const char *nm = class_getName(cs[i]);
                      if (!nm) continue;
                      BOOL isWK = (strncmp(nm, "WK", 2) == 0);
                      BOOL isSwift = (strncmp(nm, "_TtC", 4) == 0);
                      if (!isWK && !isSwift) continue;
                      if (isSwift) {
                          if (sw >= 80) continue;
                          sw++;
                          LOGE([NSString stringWithFormat:@"MILOPROBE sw %s", nm]);
                          continue;
                      }
                      wk++;
                      unsigned int mn = 0;
                      Method *m2 = class_copyMethodList(cs[i], &mn);
                      LOGE([NSString stringWithFormat:@"MILOPROBE wk %s n=%u", nm, mn]);
                      BOOL deep = (strstr(nm, "Sock") || strstr(nm, "Conn") || strstr(nm, "Sync") ||
                                   strstr(nm, "Proto") || strstr(nm, "Code") || strstr(nm, "Crypt") ||
                                   strstr(nm, "Aes") || strstr(nm, "Net") || strstr(nm, "Cli") ||
                                   strstr(nm, "Cli") || strstr(nm, "Client") || strstr(nm, "Manager"));
                      for (unsigned int j = 0; j < mn; j++) {
                          NSString *sn = NSStringFromSelector(method_getName(m2[j]));
                          if (!deep) { }
                          const char *s8 = sn.UTF8String;
                          if (!s8) continue;
                          if (deep || strstr(s8, "ecv") || strstr(s8, "ocket") || strstr(s8, "onnect") ||
                              strstr(s8, "acket") || strstr(s8, "rypt")) {
                              LOGE([NSString stringWithFormat:@"MILOPROBE   %s %@", nm, sn]);
                          }
                      }
                      free(m2);
                  }
                  free(cs);
                  LOGE([NSString stringWithFormat:@"MILOPROBE dump-done wk=%d sw=%d", wk, sw]);
              }
          }

          static void (*o_wsrecv)(id, SEL, id);
          static void h_wsrecv(id self, SEL _cmd, id comp) {
              LOGE(@"observe ws-receiveMessage");
              o_wsrecv(self, _cmd, comp);
          }

          #include <dlfcn.h>

          static void SetU64(id o, NSString *nm, unsigned long long v) {
              SEL s = NSSelectorFromString(nm);
              if (![o respondsToSelector:s]) return;
              typedef void (*F)(id, SEL, unsigned long long);
              ((F)[o methodForSelector:s])(o, s, v);
          }
          static void SetU32(id o, NSString *nm, unsigned int v) {
              SEL s = NSSelectorFromString(nm);
              if (![o respondsToSelector:s]) return;
              typedef void (*F)(id, SEL, unsigned int);
              ((F)[o methodForSelector:s])(o, s, v);
          }
          static void SetU8(id o, NSString *nm, unsigned char v) {
              SEL s = NSSelectorFromString(nm);
              if (![o respondsToSelector:s]) return;
              typedef void (*F)(id, SEL, unsigned char);
              ((F)[o methodForSelector:s])(o, s, v);
          }
          static void SetStr(id o, NSString *nm, id v) {
              SEL s = NSSelectorFromString(nm);
              if (!v || ![o respondsToSelector:s]) return;
              typedef void (*F)(id, SEL, id);
              ((F)[o methodForSelector:s])(o, s, v);
          }
          // 校验属性声明类型，类型不符坚决不写，避免污染本地消息库
          static BOOL PropClassIs(id o, NSString *prop, const char *want) {
              objc_property_t pr = class_getProperty([o class], prop.UTF8String);
              if (!pr) return NO;
              const char *at = property_getAttributes(pr);
              if (!at) return NO;
              const char *t = strstr(at, "T@\"");
              if (!t) return NO;
              t += 3;
              const char *e = strchr(t, '"');
              if (!e || e <= t) return NO;
              size_t wl = strlen(want);
              return ((size_t)(e - t) == wl) && (strncmp(t, want, wl) == 0);
          }
          static void SetObjSafe(id pkt, NSString *sel, NSString *prop, id v, const char *want) {
              if (!v) return;
              if (!PropClassIs(pkt, prop, want)) {
                  LOGE([NSString stringWithFormat:@"fixskip %@ type-mismatch", prop]);
                  return;
              }
              SetStr(pkt, sel, v);
          }
          static NSString *RdStr(const uint8_t *p, NSUInteger n, NSUInteger *pos) {
              if (*pos + 2 > n) return nil;
              NSUInteger ln = ((NSUInteger)p[*pos] << 8) | p[*pos + 1];
              *pos += 2;
              if (*pos + ln > n) return nil;
              NSString *s = ln ? [[NSString alloc] initWithBytes:p + *pos length:ln encoding:NSUTF8StringEncoding] : @"";
              if (!s) return nil;
              *pos += ln;
              return s;
          }
          static unsigned long long RdU64(const uint8_t *p, NSUInteger i) {
              unsigned long long v = 0;
              for (int j = 0; j < 8; j++) v = (v << 8) | p[i + j];
              return v;
          }
          static unsigned int RdU32(const uint8_t *p, NSUInteger i) {
              unsigned int v = 0;
              for (int j = 0; j < 4; j++) v = (v << 8) | p[i + j];
              return v;
          }
          static void HexDump(NSString *tag, NSData *d, NSUInteger maxb) {
              const uint8_t *p = d.bytes;
              NSUInteger nn = MIN(d.length, maxb);
              NSMutableString *hs = [NSMutableString stringWithCapacity:nn * 2 + 8];
              for (NSUInteger i = 0; i < nn; i++) [hs appendFormat:@"%02x", p[i]];
              LOGE([NSString stringWithFormat:@"fixrecv-hex %@ n=%lu %@", tag, (unsigned long)d.length, hs]);
          }
          static NSData *DecryptPayload(NSData *pld);
          static void FixRecv(id pkt, NSData *d) {
              if (![pkt respondsToSelector:@selector(setMessageId:)] || d.length < 24) return;
              const uint8_t *p = d.bytes; NSUInteger n = d.length;
              // 严格布局(已由真实帧 223 字节精确验证): setting(1) msgKey(u16str) fromUid(u16str) channelId(u16str) channelType(1) expire(4) clientMsgNo(u16str) msgid(8) seq(4) ts(4) payload
              NSString *from = nil, *ch = nil, *cmn = nil;
              unsigned long long mid = 0;
              unsigned int ms = 0, ts = 0, chType = 1;
              NSData *pld = nil;
              BOOL ok = NO;
              NSUInteger pos = 1;
              NSString *msgKey = RdStr(p, n, &pos);
              if (msgKey) from = RdStr(p, n, &pos);
              if (from) ch = RdStr(p, n, &pos);
              if (ch && pos + 5 <= n) {
                  chType = p[pos]; pos += 1;
                  pos += 4; // expire
                  cmn = RdStr(p, n, &pos);
                  if (cmn && pos + 16 <= n) {
                      mid = RdU64(p, pos);
                      ms = RdU32(p, pos + 8);
                      ts = RdU32(p, pos + 12);
                      if ((mid >> 56) == 0x1d) {
                          ok = YES;
                          pld = pos + 16 < n ? [d subdataWithRange:NSMakeRange(pos + 16, n - pos - 16)] : [NSData data];
                      }
                  }
              }
              if (!ok) {
                  // 回退：msgid 锚点扫描 + clientMsgNo 回溯（旧逻辑）
                  HexDump(@"strict-fail", d, 120);
                  from = nil; ch = nil; cmn = nil; chType = 1;
                  NSUInteger k = 0; int found = 0;
                  for (NSUInteger i = 8; i + 16 <= n; i++) {
                      if ((RdU64(p, i) >> 56) == 0x1d && (RdU64(p, i) & 0xFFFF) == 0) { k = i; found = 1; break; }
                  }
                  if (!found) { LOGE(@"fixrecv no-msgid"); return; }
                  mid = RdU64(p, k);
                  ms = RdU32(p, k + 8);
                  ts = RdU32(p, k + 12);
                  NSUInteger po = k + 16;
                  pld = po < n ? [d subdataWithRange:NSMakeRange(po, n - po)] : nil;
                  for (NSUInteger L = 1; L <= 48 && k >= L + 1; L++) {
                      if (p[k - 1 - L] != L) continue;
                      NSData *cd = [d subdataWithRange:NSMakeRange(k - L, L)];
                      NSString *s = [[NSString alloc] initWithData:cd encoding:NSUTF8StringEncoding];
                      if (!s) continue;
                      BOOL okc = YES;
                      for (NSUInteger q = 0; q < s.length; q++) {
                          unichar ch2 = [s characterAtIndex:q];
                          if (ch2 < 0x20 || ch2 > 0x7e) { okc = NO; break; }
                      }
                      if (okc) { cmn = s; break; }
                  }
              }
              // 包对象会被复用，仅当确实已解码出"同一帧"（msgid 与 seq 都一致）才跳过
              @try {
                  id cmid = [pkt valueForKey:@"messageId"];
                  unsigned long long cmidv = (cmid && [cmid respondsToSelector:@selector(unsignedLongLongValue)])
                                             ? [cmid unsignedLongLongValue] : 0;
                  id cseq = [pkt valueForKey:@"messageSeq"];
                  unsigned int cseqv = (cseq && [cseq respondsToSelector:@selector(unsignedIntValue)])
                                       ? [cseq unsignedIntValue] : 0;
                  id cpay = [pkt valueForKey:@"payload"];
                  if (cmidv != 0 && cmidv == mid && cseqv == ms && cpay) {
                      LOGE(@"fixrecv skip same-frame");
                      return;
                  }
              } @catch (__unused NSException *e) {}
              SetU64(pkt, @"setMessageId:", mid);
              SetU32(pkt, @"setMessageSeq:", ms);
              SetU32(pkt, @"setTimestamp:", ts);
              SetU8(pkt, @"setChannelType:", chType);
              // 字段顺序(对齐开源 SDK decodeLM)：setting, msgKey, fromUid, channelId, channelType, expire, clientMsgNo, msgId, seq, ts, payload
              // 严格解析时 hs[0]=msgKey 被跳过；解析失败必须显式置空串，避免复用对象残留旧值串频道
              SetObjSafe(pkt, @"setFromUid:", @"fromUid", from ? from : @"", "NSString");
              SetObjSafe(pkt, @"setChannelId:", @"channelId", ch ? ch : @"", "NSString");
              // payload 是 AES 密文，必须经 WKSecurityManager 解密成明文 JSON
              NSData *plain = DecryptPayload(pld);
              NSData *finalPayload = plain ? plain : pld;
              SetObjSafe(pkt, @"setPayload:", @"payload", finalPayload, "NSData");
              if (cmn) SetObjSafe(pkt, @"setClientMsgNo:", @"clientMsgNo", cmn, "NSString");
              LOGE([NSString stringWithFormat:@"fixrecv mid=%llu ms=%u ts=%u ct=%u from=%@ ch=%@ cmn=%@ plen=%lu dec=%d strict=%d",
                    mid, ms, ts, chType, from ? from : @"-", ch ? ch : @"-", cmn ? cmn : @"-",
                    (unsigned long)(finalPayload ? finalPayload.length : 0), plain ? 1 : 0, ok ? 1 : 0]);
          }

          static void FixSendack(id pkt, NSData *d) {
              if (![pkt respondsToSelector:@selector(setClientSeq:)] || d.length < 17) return;
              const uint8_t *p = d.bytes;
              unsigned long long mid = 0;
              for (int i = 0; i < 8; i++) mid = (mid << 8) | p[i];
              unsigned int cs = 0, ms = 0;
              for (int i = 8; i < 12; i++) cs = (cs << 8) | p[i];
              for (int i = 12; i < 16; i++) ms = (ms << 8) | p[i];
              unsigned char rc = p[16];
              SetU64(pkt, @"setMessageId:", mid);
              SetU32(pkt, @"setClientSeq:", cs);
              SetU32(pkt, @"setMessageSeq:", ms);
              SetU8(pkt, @"setReasonCode:", rc);
              LOGE([NSString stringWithFormat:@"fixack mid=%llu cs=%u ms=%u rc=%u", mid, cs, ms, rc]);
          }

          static NSData *DecryptPayload(NSData *pld) {
              if (!pld) return nil;
              NSString *cipher = [[NSString alloc] initWithData:pld encoding:NSUTF8StringEncoding];
              if (!cipher.length) return nil;
              Class sec = NSClassFromString(@"WKSecurityManager");
              if (!sec || ![sec respondsToSelector:@selector(shared)]) { LOGE(@"sec-missing"); return nil; }
              id sm = nil;
              @try { sm = [sec performSelector:@selector(shared)]; } @catch (__unused NSException *e) {}
              if (!sm || ![sm respondsToSelector:@selector(decryption:)]) { LOGE(@"sec-no-dec"); return nil; }
              NSString *plain = nil;
              @try { plain = [sm performSelector:@selector(decryption:) withObject:cipher]; }
              @catch (__unused NSException *e) { LOGE(@"dec-crashed"); return nil; }
              if ([plain isKindOfClass:[NSString class]] && plain.length > 0 && [plain hasPrefix:@"{"]) {
                  return [plain dataUsingEncoding:NSUTF8StringEncoding];
              }
              return nil;
          }

          // decode:header: 返回 WKPacket*，且 decodeLM 内部是 new 新对象返回
          // 必须捕获并返回原实现的返回值，失败（nil/异常）时才走手工修复
          #define PKDEC(N) \
          static id (*o_pkd##N)(id, SEL, id, id); \
          static id h_pkd##N(id s, SEL c, id d, id hh) { \
              id ret = nil; BOOL threw = NO; \
              if (o_pkd##N) { \
                  @try { ret = o_pkd##N(s, c, d, hh); } \
                  @catch (NSException *ex) { threw = YES; LOGE([NSString stringWithFormat:@"pkt%d decode-threw %@", N, ex.name]); } \
              } \
              if (N == 1 && [(id)d respondsToSelector:@selector(length)]) { \
                  if (ret) { \
                      id pf = nil; @try { pf = [ret valueForKey:@"payload"]; } @catch (__unused NSException *e) {} \
                      NSString *ps = [pf isKindOfClass:[NSData class]] ? [[NSString alloc] initWithData:pf encoding:NSUTF8StringEncoding] : nil; \
                      LOGE([NSString stringWithFormat:@"pkt1 orig-ok seq=%@ plen=%lu phead=%@", \
                            [ret valueForKey:@"messageSeq"], (unsigned long)(pf ? [pf length] : 0), \
                            ps ? [ps substringToIndex:MIN((NSUInteger)20, ps.length)] : @"?"]); \
                  } else { \
                      LOGE([NSString stringWithFormat:@"pkt1 orig-nil threw=%d", threw]); \
                      FixRecv((id)s, (NSData *)d); \
                      ret = s; \
                  } \
              } \
              if (N == 2 && (id)d && !ret) { FixSendack((id)s, (NSData *)d); ret = s; } \
              if (!ret) ret = s; \
              return ret; \
          }
          PKDEC(0) PKDEC(1) PKDEC(2) PKDEC(3) PKDEC(4) PKDEC(5)

          static void HookPackets(void) {
              const char *pk[6] = {"WKConnackPacket", "WKRecvPacket", "WKSendackPacket",
                                   "WKPingPacket", "WKPongPacket", "WKConnectPacket"};
              void *orig[6] = {(void *)&o_pkd0, (void *)&o_pkd1, (void *)&o_pkd2,
                               (void *)&o_pkd3, (void *)&o_pkd4, (void *)&o_pkd5};
              void *h[6] = {(void *)h_pkd0, (void *)h_pkd1, (void *)h_pkd2,
                            (void *)h_pkd3, (void *)h_pkd4, (void *)h_pkd5};
              for (int i = 0; i < 6; i++) {
                  Class k = objc_getClass(pk[i]);
                  if (!k) continue;
                  SEL sel = NSSelectorFromString(@"decode:header:");
                  if (![k instancesRespondToSelector:sel]) {
                      LOGE([NSString stringWithFormat:@"pkt %s no-decode", pk[i]]);
                      continue;
                  }
                  Method m = class_getInstanceMethod(k, sel);
                  *(void **)orig[i] = (void *)method_getImplementation(m);
                  method_setImplementation(m, (IMP)h[i]);
                  LOGE([NSString stringWithFormat:@"pkt hook %s", pk[i]]);
              }
          }

          static NSData *HexData(NSString *hx) {
              NSMutableData *d = [NSMutableData data];
              for (NSUInteger i = 0; i + 1 < hx.length; i += 2) {
                  unsigned int v = 0;
                  sscanf([[hx substringWithRange:NSMakeRange(i, 2)] UTF8String], "%x", &v);
                  [d appendBytes:&v length:1];
              }
              return d;
          }

          static void TryDecode(NSString *cls, NSString *hx) {
              Class k = objc_getClass(cls.UTF8String);
              if (!k) { LOGE([NSString stringWithFormat:@"st no-class %@", cls]); return; }
              @try {
                  id pkt = [[k alloc] init];
                  Class hc = objc_getClass("WKHeader");
                  id hd = hc ? [[hc alloc] init] : nil;
                  NSData *d = HexData(hx);
                  SEL sel = @selector(decode:header:);
                  typedef BOOL (*Fn)(id, SEL, NSData *, id);
                  Fn fn = (Fn)[pkt methodForSelector:sel];
                  BOOL ok = fn(pkt, sel, d, hd);
                  NSMutableString *s = [NSMutableString stringWithFormat:@"st %@ bytes=%lu ok=%d", cls, (unsigned long)d.length, (int)ok];
                  for (NSString *k2 in @[@"messageId", @"clientSeq", @"messageSeq", @"reasonCode", @"pageVersion", @"fromUid", @"channelId", @"channelType", @"clientMsgNo", @"timestamp", @"expire", @"payload"]) {
                      if ([pkt respondsToSelector:NSSelectorFromString(k2)]) {
                          id v = [pkt valueForKey:k2];
                          NSString *vs = [v isKindOfClass:[NSData class]] ? @"<data>" : [NSString stringWithFormat:@"%@", v];
                          if ([vs length] > 40) vs = [vs substringToIndex:40];
                          [s appendFormat:@" %@=%@", k2, vs ? vs : @"nil"];
                      }
                  }
                  LOGE(s);
              } @catch (NSException *e) {
                  LOGE([NSString stringWithFormat:@"st %@ EXC %@: %@", cls, e.name, e.reason]);
              }
          }

          static void DecodeSelftest(void) {
              // 服务端实际发送的 SENDACK（17 字节）
              TryDecode(@"WKSendackPacket", @"1d69cd9f63000000000000060000000101");
              // 补齐 pageVersion 后（25 字节）
              TryDecode(@"WKSendackPacket", @"1d69cd9f630000000000000600000001010000000000000000");
              // 无 pageVersion 的其他变体
              TryDecode(@"WKSendackPacket", @"1d69cd9f63000000000000060000000101deadbeefdeadbeef");
              // 真实抓包的 RECV 体（223 字节）
              TryDecode(@"WKRecvPacket", @"");
              LOGE(@"selftest-done");
          }

          static id (*o_saveMsgs)(id, SEL, id);
          static id h_saveMsgs(id self, SEL _cmd, id msgs) {
              if ([msgs isKindOfClass:[NSArray class]]) {
                  for (id m in msgs) {
                      @try {
                          LOGE([NSString stringWithFormat:@"saveMessages ch=%@ seq=%@ from=%@ ct=%@ cmn=%@",
                                [m valueForKey:@"channelId"], [m valueForKey:@"messageSeq"],
                                [m valueForKey:@"fromUid"], [m valueForKey:@"contentType"],
                                [m valueForKey:@"clientMsgNo"]]);
                      } @catch (__unused NSException *e) {}
                  }
              }
              return o_saveMsgs(self, _cmd, msgs);
          }

          static void (*o_pullLast)(id, SEL, id, int, id);
          static void h_pullLast(id self, SEL _cmd, id channel, int limit, id comp) {
              NSString *cid = nil;
              @try { cid = [channel valueForKey:@"channelId"]; } @catch (__unused NSException *e) {}
              LOGE([NSString stringWithFormat:@"pullLast ch=%@ limit=%d", cid, limit]);
              void (^orig)(NSArray *, NSError *) = comp;
              id wrapped = comp;
              if (comp) {
                  void (^wb)(NSArray *, NSError *) = ^(NSArray *ms, NSError *err) {
                      LOGE([NSString stringWithFormat:@"pullLast done ch=%@ cnt=%lu err=%@",
                            cid, (unsigned long)(ms ? ms.count : 0), err ? PDesc(err) : @"-"]);
                      if (orig) orig(ms, err);
                  };
                  wrapped = (__bridge id)CFBridgingRetain(wb); // 有意泄漏，防野指针
              }
              o_pullLast(self, _cmd, channel, limit, wrapped);
          }

          // ---- 媒体下载链路追踪 ----
          static void (*o_lbl_settext)(id, SEL, id);
          static void h_lbl_settext(id self, SEL _cmd, id t) {
              if ([t isKindOfClass:[NSString class]] && ([t containsString:@"过期"] || [t containsString:@"已被清理"])) {
                  NSArray *syms = [NSThread callStackSymbols];
                  NSMutableString *stk = [NSMutableString string];
                  for (NSUInteger i = 0; i < MIN(syms.count, 25); i++) [stk appendFormat:@"\n  %@", syms[i]];
                  LOGE([NSString stringWithFormat:@"EXPIRE-LABEL text=%@ stack:%@", t, stk]);
              }
              o_lbl_settext(self, _cmd, t);
          }
          static id (*o_sdm_load)(id, SEL, id, unsigned long, id, id);
          static id h_sdm_load(id self, SEL _cmd, id url, unsigned long opt, id prog, id comp) {
              LOGE([NSString stringWithFormat:@"sdload url=%@ opts=%lu", url, opt]);
              return o_sdm_load(self, _cmd, url, opt, prog, comp);
          }
          static id (*o_sdiv_setimg)(id, SEL, id, id, unsigned long, id, id);
          static id h_sdiv_setimg(id self, SEL _cmd, id url, id ph, unsigned long opt, id ctx, id prog) {
              LOGE([NSString stringWithFormat:@"sdiv-setimg url=%@ ph=%@", url, ph ? @"y" : @"n"]);
              return o_sdiv_setimg(self, _cmd, url, ph, opt, ctx, prog);
          }
          static void HookMediaDownload(void) {
              patch(objc_getClass("UILabel"), @selector(setText:), (void *)h_lbl_settext, (void **)&o_lbl_settext);
              Class sdm = objc_getClass("SDWebImageManager");
              if (sdm) {
                  SEL sel = @selector(loadImageWithURL:options:progress:completed:);
                  if ([sdm instancesRespondToSelector:sel]) {
                      patch(sdm, sel, (void *)h_sdm_load, (void **)&o_sdm_load);
                      LOGE(@"sdwebimage-manager hooked");
                  } else { LOGE(@"sdwebimage-manager no loadImage sel"); }
              } else { LOGE(@"sdwebimage absent"); }
              Class iv = objc_getClass("UIImageView");
              SEL s2 = NSSelectorFromString(@"sd_setImageWithURL:placeholderImage:options:context:progress:");
              if (iv && [iv instancesRespondToSelector:s2]) {
                  patch(iv, s2, (void *)h_sdiv_setimg, (void **)&o_sdiv_setimg);
                  LOGE(@"sdiv-setimg hooked");
              }
          }

          static void ProbeInit(void) {
              g_buf = [NSMutableArray array];
              g_lock = [NSLock new];

              patch(objc_getClass("WKApp"), @selector(showUChatRightsAlertViewWithTitle:action:), (void *)h_show1, (void **)&o_show1);
              patch(objc_getClass("WKApp"), @selector(showUChatRightsAlertViewWithTitle:subtitle:buttonTypes:action:), (void *)h_show4, (void **)&o_show4);
              patch(objc_getClass("WKConversationListVC"), @selector(checkRightsExpiryIfNeeded), (void *)h_check, (void **)&o_check);
              patch(objc_getClass("UIViewController"), @selector(presentViewController:animated:completion:), (void *)h_present, (void **)&o_present);
              patch(objc_getClass("UINavigationController"), @selector(pushViewController:animated:), (void *)h_push, (void **)&o_push);

              Class cm = objc_getClass("WKChatManager");
              Class aes = objc_getClass("WKAESUtil");
              LOGE([NSString stringWithFormat:@"%sinit chatManager=%@ aesUtil=%@", kN, cm ? @"yes" : @"no", aes ? @"yes" : @"no"]);
              patch(cm, @selector(handleRecv:), (void *)h_recv, (void **)&o_recv);
              patch(cm, @selector(handleSendack:), (void *)h_ack, (void **)&o_ack);
              patch(cm, @selector(recvPacketsToMessages:), (void *)h_rpm, (void **)&o_rpm);
              patch(cm, @selector(filterNeedStoreMessages:), (void *)h_fns, (void **)&o_fns);
              patch(cm, @selector(callRecvMessagesDelegate:), (void *)h_crd, (void **)&o_crd);
              patch(cm, @selector(callSendackDelegate:left:), (void *)h_csd, (void **)&o_csd);
              patch(cm, @selector(sendMessage:addRetryQueue:), (void *)h_send, (void **)&o_send);
              patch(cm, @selector(saveMessage:channel:fromUid:status:setting:clientMsgNo:topic:), (void *)h_save, (void **)&o_save);
              patch(cm, @selector(saveMessages:), (void *)h_saveMsgs, (void **)&o_saveMsgs);
              if ([cm instancesRespondToSelector:@selector(pullLastMessages:limit:complete:)]) {
                  patch(cm, @selector(pullLastMessages:limit:complete:), (void *)h_pullLast, (void **)&o_pullLast);
              }
              patch(aes, @selector(aesDecrypt:key:iv:), (void *)h_dec, (void **)&o_dec);
              patch(cm, NSSelectorFromString(@"handleMessages:"), (void *)h_hmsgs, (void **)&o_hmsgs);
              HookMediaDownload();
              Class wt = objc_getClass("NSURLSessionWebSocketTask");
              if (wt) patch(wt, NSSelectorFromString(@"receiveMessageWithCompletionHandler:"), (void *)h_wsrecv, (void **)&o_wsrecv);
              HookPackets();
              LOGE(@"MILOPROBE init-done");
              ScheduleFlush();
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)12 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  DecodeSelftest();
              });
          }

          __attribute__((constructor)) static void milo_init(void) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)2 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  ProbeInit();
              });
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)4 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  ShowMarker();
              });
          }
          OBJC

      - name: Build dylib
        run: |
          set -o pipefail
          SDK=$PWD/sdks/iPhoneOS16.5.sdk
          which ld64.lld || ls /usr/bin/*lld* || true
          ls /usr/lib/llvm-14/bin/ | grep -i lld || true
          LINKER=$(command -v ld64.lld || echo /usr/lib/llvm-14/bin/ld64.lld)
          echo "using linker: $LINKER"
          clang -target arm64-apple-ios14.0 \
            -isysroot "$SDK" \
            -F"$SDK/System/Library/Frameworks" \
            -I"$SDK/usr/include" \
            -fobjc-arc -dynamiclib -O2 -Wno-deprecated-declarations \
            -Wno-unused-function -Wno-unused-variable \
            -framework Foundation -framework UIKit \
            -undefined dynamic_lookup \
            -fuse-ld="$LINKER" \
            -Wl,-platform_version,ios,14.0,14.0 \
            -o MiloPatch.dylib hook.m 2>&1 | tail -25
          ls -la MiloPatch.dylib

      - name: Sign dylib
        run: |
          set -o pipefail
          curl -sL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o ldid
          chmod +x ldid
          ./ldid -S MiloPatch.dylib
          ls -la MiloPatch.dylib
          file MiloPatch.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: MiloPatch-dylib
          path: MiloPatch.dylib
