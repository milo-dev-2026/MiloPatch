          // 验证码输入框: 原实现只允许 4 位, 数字输入时放宽到 6 位
          static BOOL h_tf_shouldchange(id self, SEL _cmd, id tf, NSRange range, id str) {
              BOOL r = NO;
              IMP o = FindOrig(self, _cmd);
              if (o) r = ((BOOL(*)(id, SEL, id, NSRange, id))o)(self, _cmd, tf, range, str);
              if (r) return YES;
              @try {
                  UITextField *f = (UITextField *)tf;
                  NSString *cur = f.text ?: @"";
                  NSString *rep = [str isKindOfClass:[NSString class]] ? (NSString *)str : @"";
                  if (range.location > cur.length || range.location + range.length > cur.length) return NO;
                  NSUInteger nl = cur.length - range.length + rep.length;
                  BOOL digits = YES;
                  for (NSUInteger i = 0; i < cur.length; i++) { unichar c = [cur characterAtIndex:i]; if (c < '0' || c > '9') { digits = NO; break; } }
                  if (digits) for (NSUInteger i = 0; i < rep.length; i++) { unichar c = [rep characterAtIndex:i]; if (c < '0' || c > '9') { digits = NO; break; } }
                  NSString *del = NSStringFromClass([self class]);
                  static int s_n = 0;
                  if (s_n++ < 40) LOGE([NSString stringWithFormat:@"TFSC del=%@ tf=%@ cur=%lu new=%lu rep=\"%@\" digits=%d",
                      del, NSStringFromClass([f class]), (unsigned long)cur.length, (unsigned long)nl, rep, digits]);
                  if (digits && nl <= 6 && nl > cur.length) {
                      LOGE([NSString stringWithFormat:@"TFSC allow6 del=%@ new=%lu", del, (unsigned long)nl]);
                      return YES;
                  }
              } @catch (NSException *e) {}
              return r;
          }
          static void HookTFDelegate(void) {
              @try {
                  if (!g_origMap) g_origMap = [NSMutableDictionary dictionary];
                  int n = objc_getClassList(NULL, 0);
                  Class *cs = (Class *)malloc(sizeof(Class) * (n > 0 ? n : 1));
                  if (!cs) return;
                  n = objc_getClassList(cs, n);
                  SEL sel = NSSelectorFromString(@"textField:shouldChangeCharactersInRange:replacementString:");
                  int hooked = 0;
                  for (int i = 0; i < n; i++) {
                      Class c = cs[i];
                      const char *img = class_getImageName(c);
                      if (!img) continue;
                      if (strstr(img, "/System/Library") || strstr(img, "/usr/lib")) continue;
                      Method m = FindOwnMethod(c, sel);
                      if (!m) continue;
                      IMP cur = method_getImplementation(m);
                      if (cur == (IMP)h_tf_shouldchange) continue;
                      g_origMap[MapKey(c, sel)] = [NSValue valueWithPointer:cur];
                      method_setImplementation(m, (IMP)h_tf_shouldchange);
                      hooked++;
                      if (hooked <= 12) LOGE([NSString stringWithFormat:@"tfdel hook %s", class_getName(c)]);
                  }
                  free(cs);
                  LOGE([NSString stringWithFormat:@"tfdel hooked=%d", hooked]);
              } @catch (NSException *e) { LOGE(@"tfdel ERR"); }
          }
          // ===== brand11: 依据 RE 头文件的数据源级精准裁剪 =====
          // WKBaseTableVC._items = NSMutableArray<WKFormSection>, WKFormSection._items = NSArray<item>
          // 我的页: WKMeVC(继承 WKBaseTableVC) / 通讯录: WKContactsVC / 设置: *SettingVC
          static NSString *MiloStrProp(id o, NSString *key) {
              @try {
                  if ([o isKindOfClass:[NSDictionary class]]) {
                      id v = [(NSDictionary *)o objectForKey:key];
                      return [v isKindOfClass:[NSString class]] ? v : nil;
                  }
                  if ([o respondsToSelector:NSSelectorFromString(key)]) {
                      id v = [o valueForKey:key];
                      return [v isKindOfClass:[NSString class]] ? v : nil;
                  }
              } @catch (NSException *e) {}
              return nil;
          }
          static NSString *MiloItemTitle(id it) {
              if (!it) return nil;
              for (NSString *k in @[@"label", @"title", @"name", @"cellTitle"]) {
                  NSString *s = MiloStrProp(it, k);
                  if (s.length) return s;
              }
              @try {
                  unsigned int pc = 0;
                  objc_property_t *ps = class_copyPropertyList([it class], &pc);
                  if (ps) {
                      for (unsigned int i = 0; i < pc; i++) {
                          const char *nm = property_getName(ps[i]);
                          if (!nm) continue;
                          NSString *s = MiloStrProp(it, [NSString stringWithUTF8String:nm]);
                          if (s.length) { free(ps); return s; }
                      }
                      free(ps);
                  }
              } @catch (NSException *e) {}
              return nil;
          }
          static BOOL MiloBlockedTitle(NSString *t, NSSet *blocked) {
              if (!t.length || !blocked) return NO;
              for (NSString *w in blocked) {
                  if ([t isEqualToString:w] || [t containsString:w]) return YES;
              }
              return NO;
          }
          static NSArray *MiloFilterItems(NSArray *items, NSSet *blocked, NSString *tag) {
              NSMutableArray *keep = [NSMutableArray array];
              for (id it in items) {
                  NSString *t = MiloItemTitle(it);
                  if (MiloBlockedTitle(t, blocked)) {
                      LOGE([NSString stringWithFormat:@"RE11 drop(%@) \"%@\"", tag, t]);
                      continue;
                  }
                  @try {
                      id sub = [it respondsToSelector:@selector(items)] ? [it valueForKey:@"items"] : nil;
                      if ([sub isKindOfClass:[NSArray class]] && [(NSArray *)sub count]) {
                          NSArray *f = MiloFilterItems((NSArray *)sub, blocked, tag);
                          if (f.count != [(NSArray *)sub count] && [it respondsToSelector:@selector(setItems:)]) {
                              [it performSelector:@selector(setItems:) withObject:f];
                          }
                      }
                  } @catch (NSException *e) {}
                  [keep addObject:it];
              }
              return keep;
          }
          static NSArray *MiloFilterSections(NSArray *sections, NSSet *blocked, NSString *tag) {
              NSMutableArray *out = [NSMutableArray array];
              for (id sec in sections) {
                  @try {
                      id itemsObj = [sec respondsToSelector:@selector(items)] ? [sec valueForKey:@"items"] : nil;
                      if (![itemsObj isKindOfClass:[NSArray class]]) { [out addObject:sec]; continue; }
                      NSArray *f = MiloFilterItems((NSArray *)itemsObj, blocked, tag);
                      if (f.count == [(NSArray *)itemsObj count]) { [out addObject:sec]; continue; }
                      if (!f.count) { LOGE([NSString stringWithFormat:@"RE11 drop section(%@) title=%@", tag, MiloStrProp(sec, @"title") ?: @""]); continue; }
                      if ([sec respondsToSelector:@selector(setItems:)]) [sec performSelector:@selector(setItems:) withObject:f];
                      [out addObject:sec];
                  } @catch (NSException *e) { [out addObject:sec]; }
              }
              return out;
