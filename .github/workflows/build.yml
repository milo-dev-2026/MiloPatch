          static NSArray *SkipSels(void) {
              static NSArray *s = nil;
              if (!s) s = @[@"description", @"debugDescription", @"dealloc", @".cxx_destruct", @"hash", @"isEqual:", @"class", @"superclass", @"observeValueForKeyPath:ofObject:change:context:", @"layoutSubviews", @"drawRect:", @"setNeedsLayout", @"setNeedsDisplay", @"setNeedsUpdateConstraints", @"updateConstraints", @"copy", @"mutableCopy", @"respondsToSelector:", @"conformsToProtocol:", @"isKindOfClass:", @"methodSignatureForSelector:", @"forwardInvocation:", @"setValue:forKey:", @"valueForKey:", @"willMoveToSuperview:", @"didMoveToSuperview", @"willMoveToWindow:", @"didMoveToWindow", @"setFrame:", @"setBounds:", @"setCenter:", @"setAlpha:", @"setHidden:", @"setBackgroundColor:"];
