          static void DumpProps(id obj, NSString *tag) {
              @try {
                  NSMutableString *out = [NSMutableString string];
                  Class k = [obj class];
                  while (k && k != [NSObject class]) {
                      unsigned int pc = 0;
                      objc_property_t *props = class_copyPropertyList(k, &pc);
                      for (unsigned int i = 0; i < pc; i++) {
                          const char *pn = property_getName(props[i]);
                          id v = nil;
                          @try { v = [obj valueForKey:[NSString stringWithUTF8String:pn]]; } @catch (NSException *e) {}
                          if (v) [out appendFormat:@"%s=%@;", pn, PDesc(v)];
                      }
                      if (props) free(props);
                      k = class_getSuperclass(k);
                      if (k == [obj class]) break;
                  }
                  LOGE([NSString stringWithFormat:@"%@ %@", tag, out]);
              } @catch (NSException *e) {}
          }
          static void h_yb_loaddata(id self, SEL _cmd) {
