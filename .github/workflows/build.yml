          // 只用运行时可改的方法 hook, 绝不改写已签名代码页
          // 目的: 打印 FALiteVideo 内部读取的远程配置 key/value, 找出被判定为 NO 的开关
          #include <mach-o/dyld.h>
          #include <mach-o/loader.h>
          #include <string.h>

          static uintptr_t g_fvLo = 0, g_fvHi = 0;

          static void ComputeFVRange(void) {
              @try {
                  uint32_t n = _dyld_image_count();
                  for (uint32_t i = 0; i < n; i++) {
                      const char *nm = _dyld_get_image_name(i);
                      if (!nm || !strstr(nm, "FALiteVideo")) continue;
                      const struct mach_header_64 *mh = (const struct mach_header_64 *)_dyld_get_image_header(i);
                      if (!mh || mh->magic != MH_MAGIC_64) continue;
                      intptr_t slide = _dyld_get_image_vmaddr_slide(i);
                      uint8_t *p = (uint8_t *)mh + sizeof(struct mach_header_64);
                      for (uint32_t c = 0; c < mh->ncmds && mh->ncmds < 4096; c++) {
                          struct load_command *lc = (struct load_command *)p;
                          if (lc->cmdsize < 8 || lc->cmdsize > 0x10000) break;
                          if (lc->cmd == LC_SEGMENT_64) {
                              struct segment_command_64 *seg = (struct segment_command_64 *)lc;
                              if (strcmp(seg->segname, "__TEXT") == 0 && seg->nsects < 512) {
                                  struct section_64 *sec = (struct section_64 *)(seg + 1);
                                  for (uint32_t k = 0; k < seg->nsects; k++) {
                                      if (strcmp(sec[k].sectname, "__text") == 0) {
                                          g_fvLo = (uintptr_t)(sec[k].addr + slide);
                                          g_fvHi = g_fvLo + (uintptr_t)sec[k].size;
                                      }
                                  }
                              }
                          }
                          p += lc->cmdsize;
                      }
                  }
                  LOGE([NSString stringWithFormat:@"fvtrace: lo=%p hi=%p", (void *)g_fvLo, (void *)g_fvHi]);
              } @catch (NSException *e) { LOGE(@"fvtrace ERR"); }
          }

          // 只 hook 这两个具体类, 不碰任何公共基类
          static Class g_dcls[2];
          static IMP   g_dorig[2];
          static int   g_dn = 0;
          static int   g_cfgLog = 0;

          static id h_subscript(id self, SEL _cmd, id key) {
              int idx = -1;
              Class k = object_getClass(self);
              for (int i = 0; i < g_dn; i++) if (g_dcls[i] == k) { idx = i; break; }
              if (idx < 0) return nil;
              // 只拦截 FALiteVideo 内部对 vip / verified 的取值, 其余原样返回
              @try {
                  uintptr_t ra = (uintptr_t)__builtin_return_address(0);
                  if (g_fvLo && ra >= g_fvLo && ra < g_fvHi && [key isKindOfClass:[NSString class]]) {
                      NSString *ks = (NSString *)key;
                      if ([ks isEqualToString:@"verified"]) {
                          id orig = ((id(*)(id, SEL, id))g_dorig[idx])(self, _cmd, key);
                          if (!orig || ([orig respondsToSelector:@selector(boolValue)] && ![orig boolValue])) {
                              LOGE([NSString stringWithFormat:@"fvcfg FORCE-YES key=%@ (was %@)", ks, orig]);
                              return @YES;
                          }
                          return orig;
                      }
                      if ([ks isEqualToString:@"vip"]) {
                          id orig = ((id(*)(id, SEL, id))g_dorig[idx])(self, _cmd, key);
                          LOGE([NSString stringWithFormat:@"fvcfg VIP-KEEP val=%@", orig]);
                          return orig;
                      }
                  }
              } @catch (NSException *e) {}
              id v = ((id(*)(id, SEL, id))g_dorig[idx])(self, _cmd, key);
              @try {
                  uintptr_t ra = (uintptr_t)__builtin_return_address(0);
                  BOOL inFV = (g_fvLo && ra >= g_fvLo && ra < g_fvHi);
                  if (inFV) {
                      LOGE([NSString stringWithFormat:@"fvcfg key=%@ val=%@", key, v]);
                  } else if (g_cfgLog < 400 && [key isKindOfClass:[NSString class]]) {
                      NSString *ks = (NSString *)key;
                      NSString *low = [ks lowercaseString];
                      if ([low containsString:@"video"] || [low containsString:@"duration"] ||
                          [low containsString:@"second"] || [low containsString:@"record"] ||
                          [low containsString:@"media"] || [low containsString:@"max"]) {
                          g_cfgLog++;
                          LOGE([NSString stringWithFormat:@"allcfg key=%@ val=%@ caller=%p", ks, v, (void *)ra]);
                      }
                  }
              } @catch (NSException *e) {}
              return v;
          }

