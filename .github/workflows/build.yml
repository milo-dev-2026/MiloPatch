                          if (!te || te[0] != '@') continue;
                          id val = object_getIvar(sec, ivs[i]);
                          if (![val isKindOfClass:[NSArray class]]) continue;
                          if ([(NSArray *)val count] == 0 || [(NSArray *)val count] > 60) continue;
                          NSMutableArray *keep = [NSMutableArray arrayWithCapacity:[(NSArray *)val count]];
                          BOOL chg = NO;
                          for (id it in (NSArray *)val) {
                              NSString *sp = MeAllStringProps(it);
                              BOOL blocked = NO;
                              for (NSString *b in @[@"分享邀请", @"网页登录", @"会员中心", @"道具商城", @"我的道具", @"余额", @"UCoin"]) {
                                  if ([sp containsString:b]) { blocked = YES; break; }
                              }
                              if (blocked) { chg = YES; LOGE([NSString stringWithFormat:@"me purge rm %@", sp]); continue; }
                              [keep addObject:it];
                          }
                          if (chg) {
                              if ([val isKindOfClass:[NSMutableArray class]]) [(NSMutableArray *)val setArray:keep];
                              else object_setIvar(sec, ivs[i], keep);
                              any = YES;
                          }
                      }
                      if (ivs) free(ivs);
                      k = class_getSuperclass(k);
                  }
              } @catch (NSException *e) {}
              return any;
