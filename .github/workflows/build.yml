          static void HideAncestorOfLabel(UILabel *l, NSString *why) {
              @try {
                  UIView *p = l;
                  NSMutableString *chain = [NSMutableString string];
                  for (int i = 0; i < 7 && p.superview; i++) {
                      p = p.superview;
                      [chain appendFormat:@" %@[%d,%d %dx%d]", NSStringFromClass([p class]),
                          (int)p.frame.origin.x, (int)p.frame.origin.y, (int)p.frame.size.width, (int)p.frame.size.height];
                      BOOL isCell = [p isKindOfClass:[UITableViewCell class]] || [p isKindOfClass:[UICollectionViewCell class]];
                      BOOL rowLike = (p.frame.size.width > 240 && p.frame.size.height >= 30 && p.frame.size.height <= 96);
                      BOOL tileLike = (p.frame.size.width >= 56 && p.frame.size.width <= 150 && p.frame.size.height >= 40 && p.frame.size.height <= 120);
                      if (isCell || rowLike || tileLike) {
                          p.hidden = YES;
                          p.alpha = 0;
                          LOGE([NSString stringWithFormat:@"HIT10 hide(%@) at %@ chain:%@", why, NSStringFromClass([p class]), chain]);
                          return;
