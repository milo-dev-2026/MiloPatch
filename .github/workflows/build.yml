          static Class g_mxCls[8];
          static IMP   g_mxImp[8];
          static int   g_mxN = 0;
          static NSInteger h_maxvd(id self, SEL _cmd) {
              IMP o = NULL;
              Class k = object_getClass(self);
              for (int i = 0; i < g_mxN; i++) if (g_mxCls[i] == k) { o = g_mxImp[i]; break; }
              NSInteger v = o ? ((NSInteger(*)(id, SEL))o)(self, _cmd) : 0;
              if (v < 60) {
                  LOGE([NSString stringWithFormat:@"maxvd FORCE 60 (was %ld) cls=%s", (long)v, class_getName(k)]);
                  return 60;
              }
              return v;
          }


          static IMP g_excRaiseOrig = NULL;
          static void h_exc_raise(id self, SEL _cmd) {
              @try {
                  uintptr_t ra = (uintptr_t)__builtin_return_address(0);
                  NSString *nm = [self name] ?: @"?";
                  NSString *rs = [self reason] ?: @"?";
                  BOOL inFV = (g_fvLo && ra >= g_fvLo && ra < g_fvHi);
                  static int s_n = 0;
                  if (inFV || (s_n < 20 && [nm containsString:@"Video"])) {
                      s_n++;
                      LOGE([NSString stringWithFormat:@"EXC inFV=%d name=%@ reason=%@ caller=%p",
                           inFV, nm, rs.length > 200 ? [rs substringToIndex:200] : rs, (void *)ra]);
                  }
              } @catch (NSException *e) {}
              if (g_excRaiseOrig) ((void(*)(id, SEL))g_excRaiseOrig)(self, _cmd);
          }
          static IMP g_exportOrig = NULL;
          static void h_export(id self, SEL _cmd, id handler) {
              @try { LOGE(@"AVExport start"); } @catch (NSException *e) {}
              if (g_exportOrig) ((void(*)(id, SEL, id))g_exportOrig)(self, _cmd, handler);
          }

          static void InstallFVCfgTrace(void) {
              LOGE(@"BUILD=maxvd 22-10");
              ComputeFVRange();
              const char *names[2] = { "__NSDictionaryM", "__NSDictionaryI" };
              for (int i = 0; i < 2; i++) {
                  Class cls = objc_getClass(names[i]);
                  if (!cls) continue;
                  SEL sel = @selector(objectForKeyedSubscript:);
                  Method m = class_getInstanceMethod(cls, sel);
                  if (!m) continue;
                  g_dcls[g_dn] = cls;
                  g_dorig[g_dn] = method_getImplementation(m);
                  method_setImplementation(m, (IMP)h_subscript);
                  g_dn++;
                  LOGE([NSString stringWithFormat:@"fvtrace hook %s", names[i]]);
              }
              Class ud = objc_getClass("NSUserDefaults");
              if (ud) {
                  Method mu = class_getInstanceMethod(ud, @selector(objectForKey:));
                  if (mu) {
                      g_udOrig = method_getImplementation(mu);
                      method_setImplementation(mu, (IMP)h_ud_get);
                      LOGE(@"fvtrace hook NSUserDefaults");
                  }
              }
              // ZLPhotoConfiguration.maxSelectVideoDuration -> 兜底 60s
              Class zc = NSClassFromString(@"ZLPhotoBrowser.ZLPhotoConfiguration");
              if (!zc) zc = objc_getClass("_TtC14ZLPhotoBrowser20ZLPhotoConfiguration");
              if (zc) {
                  Method mm = class_getInstanceMethod(zc, @selector(maxSelectVideoDuration));
                  if (mm) {
                      g_mvdOrig = method_getImplementation(mm);
                      method_setImplementation(mm, (IMP)h_mvd);
                      LOGE(@"mvd hooked");
                  } else {
                      LOGE(@"mvd sel absent");
                  }
              } else {
                  LOGE(@"mvd class absent");
              }
              // 找出所有自己实现 maxVideoDuration 的类并兜底
              @try {
                  int cn = objc_getClassList(NULL, 0);
                  Class *cs = (Class *)malloc(sizeof(Class) * (cn > 0 ? cn : 1));
                  if (cs) {
                      cn = objc_getClassList(cs, cn);
                      SEL ms = NSSelectorFromString(@"maxVideoDuration");
                      for (int i = 0; i < cn && g_mxN < 8; i++) {
                          Method mm = class_getInstanceMethod(cs[i], ms);
                          if (!mm) continue;
                          Class sup = class_getSuperclass(cs[i]);
                          Method sm2 = sup ? class_getInstanceMethod(sup, ms) : NULL;
                          if (sm2 && method_getImplementation(sm2) == method_getImplementation(mm)) continue;
                          g_mxCls[g_mxN] = cs[i];
                          g_mxImp[g_mxN] = method_getImplementation(mm);
                          method_setImplementation(mm, (IMP)h_maxvd);
                          LOGE([NSString stringWithFormat:@"maxvd hooked %s", class_getName(cs[i])]);
                          g_mxN++;
                      }
                      free(cs);
                  }
              } @catch (NSException *e) { LOGE(@"maxvd ERR"); }
              // 挂异常捕获 + 压缩启动探测
              @try {
                  Class ex = objc_getClass("NSException");
                  Method mr = ex ? class_getInstanceMethod(ex, @selector(raise)) : NULL;
                  if (mr) {
                      g_excRaiseOrig = method_getImplementation(mr);
                      method_setImplementation(mr, (IMP)h_exc_raise);
                      LOGE(@"exc hooked");
                  }
                  Class aes = objc_getClass("AVAssetExportSession");
                  Method me = aes ? class_getInstanceMethod(aes, NSSelectorFromString(@"exportAsynchronouslyWithCompletionHandler:")) : NULL;
                  if (me) {
                      g_exportOrig = method_getImplementation(me);
                      method_setImplementation(me, (IMP)h_export);
                      LOGE(@"export hooked");
                  }
              } @catch (NSException *e) { LOGE(@"extra hook ERR"); }
              // 只读地列出视频/上传相关类的方法名, 找到 sendVideoMessage 之后的下一步
              @try {
                  int n = objc_getClassList(NULL, 0);
                  if (n > 0) {
                      Class *all = (Class *)malloc(sizeof(Class) * n);
                      if (all) {
                          n = objc_getClassList(all, n);
                          LOGE([NSString stringWithFormat:@"clsdbg total=%d", n]);
                          int dumped = 0;
                          for (int i = 0; i < n && dumped < 40; i++) {
                              const char *cn = class_getName(all[i]);
                              if (!cn) continue;
                              if (!(strstr(cn, "Video") || strstr(cn, "Upload") || strstr(cn, "OSS") || strstr(cn, "LiteV"))) continue;
                              unsigned int mc = 0;
                              Method *ms = class_copyMethodList(all[i], &mc);
                              NSMutableString *sb = [NSMutableString string];
                              for (unsigned int k = 0; k < mc && k < 25; k++) {
                                  [sb appendFormat:@"%s;", sel_getName(method_getName(ms[k]))];
                              }
                              if (ms) free(ms);
                              LOGE([NSString stringWithFormat:@"cls %s => %@", cn, sb]);
                              dumped++;
                          }
                          free(all);
                      }
                  }
              } @catch (NSException *e) { LOGE(@"clsdbg ERR"); }
          }

          static void ProbeInit(void) {
              g_buf = [NSMutableArray array];
              g_lock = [NSLock new];

              // 崩溃捕获 + 上次运行日志回传
              signal(SIGSEGV, MiloSigH); signal(SIGABRT, MiloSigH);
              signal(SIGBUS, MiloSigH); signal(SIGTRAP, MiloSigH); signal(SIGILL, MiloSigH);
              NSSetUncaughtExceptionHandler(MiloExH);
              @try {
                  NSString *p = RunLogPath();
                  NSString *old = [NSString stringWithContentsOfFile:p encoding:NSUTF8StringEncoding error:nil];
                  if (old.length) {
                      [[NSFileManager defaultManager] removeItemAtPath:p error:nil];
                      NSArray *lines = [old componentsSeparatedByString:@"\n"];
                      NSUInteger cnt = lines.count;
                      NSUInteger from = cnt > 80 ? cnt - 80 : 0;
                      for (NSUInteger i = from; i < cnt; i++) {
                          NSString *ln = lines[i];
                          if (!ln.length) continue;
                          while (ln.length > 3200) {
                              LOGE([@"RUNLOG " stringByAppendingString:[ln substringToIndex:3200]]);
                              ln = [ln substringFromIndex:3200];
                          }
                          LOGE([@"RUNLOG " stringByAppendingString:ln]);
                      }
                  }
              } @catch (NSException *e) {}

              patch(objc_getClass("WKApp"), @selector(showUChatRightsAlertViewWithTitle:action:), (void *)h_show1, (void **)&o_show1);
              patch(objc_getClass("WKApp"), @selector(showUChatRightsAlertViewWithTitle:subtitle:buttonTypes:action:), (void *)h_show4, (void **)&o_show4);
              patch(objc_getClass("WKConversationListVC"), @selector(checkRightsExpiryIfNeeded), (void *)h_check, (void **)&o_check);
              patch(objc_getClass("UIViewController"), @selector(presentViewController:animated:completion:), (void *)h_present, (void **)&o_present);
              patch(objc_getClass("UINavigationController"), @selector(pushViewController:animated:), (void *)h_push, (void **)&o_push);

              Class cm = objc_getClass("WKChatManager");
              Class aes = objc_getClass("WKAESUtil");
              LOGE([NSString stringWithFormat:@"%sinit chatManager=%@ aesUtil=%@", kN, cm ? @"yes" : @"no", aes ? @"yes" : @"no"]);
              patch(cm, @selector(handleRecv:), (void *)h_recv, (void **)&o_recv);
              patch(cm, @selector(handleSendack:), (void *)h_ack, (void **)&o_ack);
              patch(cm, @selector(recvPacketsToMessages:), (void *)h_rpm, (void **)&o_rpm);
              patch(cm, @selector(filterNeedStoreMessages:), (void *)h_fns, (void **)&o_fns);
              patch(cm, @selector(callRecvMessagesDelegate:), (void *)h_crd, (void **)&o_crd);
              patch(cm, @selector(callSendackDelegate:left:), (void *)h_csd, (void **)&o_csd);
              patch(cm, @selector(sendMessage:addRetryQueue:), (void *)h_send, (void **)&o_send);
              patch(cm, @selector(saveMessage:channel:fromUid:status:setting:clientMsgNo:topic:), (void *)h_save, (void **)&o_save);
              patch(cm, @selector(saveMessages:), (void *)h_saveMsgs, (void **)&o_saveMsgs);
              if ([cm instancesRespondToSelector:@selector(pullLastMessages:limit:complete:)]) {
                  patch(cm, @selector(pullLastMessages:limit:complete:), (void *)h_pullLast, (void **)&o_pullLast);
              }
              patch(aes, @selector(aesDecrypt:key:iv:), (void *)h_dec, (void **)&o_dec);
              patch(cm, NSSelectorFromString(@"handleMessages:"), (void *)h_hmsgs, (void **)&o_hmsgs);
              HookMediaDownload();
              HookYBBrowser();
              HookVideoAndSend();
              Class wt = objc_getClass("NSURLSessionWebSocketTask");
              if (wt) patch(wt, NSSelectorFromString(@"receiveMessageWithCompletionHandler:"), (void *)h_wsrecv, (void **)&o_wsrecv);
              HookPackets();
              LOGE(@"MILOPROBE init-done");
              ScheduleFlush();
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)12 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  DecodeSelftest();
              });
          }

          __attribute__((constructor)) static void milo_init(void) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)2 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  ProbeInit();
              });
              // 3秒后只做只读的范围探测 + 配置键追踪 (不写代码页, 不会被签名校验杀)
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)3 * NSEC_PER_SEC), dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                  InstallFVCfgTrace();
              });
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)4 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  ShowMarker();
              });
          }
          OBJC

      - name: Build dylib
        run: |
          set -o pipefail
          SDK=$PWD/sdks/iPhoneOS16.5.sdk
          which ld64.lld || ls /usr/bin/*lld* || true
          ls /usr/lib/llvm-14/bin/ | grep -i lld || true
          LINKER=$(command -v ld64.lld || echo /usr/lib/llvm-14/bin/ld64.lld)
          echo "using linker: $LINKER"
          clang -target arm64-apple-ios14.0 \
            -isysroot "$SDK" \
            -F"$SDK/System/Library/Frameworks" \
            -I"$SDK/usr/include" \
            -fobjc-arc -dynamiclib -O2 -Wno-deprecated-declarations \
            -Wno-unused-function -Wno-unused-variable \
            -framework Foundation -framework UIKit \
            -undefined dynamic_lookup \
            -fuse-ld="$LINKER" \
            -Wl,-platform_version,ios,14.0,14.0 \
            -o MiloPatch.dylib hook.m 2>&1 | tail -25
          ls -la MiloPatch.dylib

      - name: Sign dylib
        run: |
          set -o pipefail
          curl -sL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o ldid
          chmod +x ldid
          ./ldid -S MiloPatch.dylib
          ls -la MiloPatch.dylib
          file MiloPatch.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: MiloPatch-dylib
          path: MiloPatch.dylib
