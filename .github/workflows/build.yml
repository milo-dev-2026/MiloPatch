          // ---- YBImageBrowser 数据源追踪 ----
          static void (*o_yb_loaddata)(id, SEL);
          static void DumpProps(id obj, NSString *tag) {
              @try {
                  NSMutableString *out = [NSMutableString string];
                  Class k = [obj class];
                  while (k && k != [NSObject class]) {
                      unsigned int pc = 0;
                      objc_property_t *props = class_copyPropertyList(k, &pc);
                      for (unsigned int i = 0; i < pc; i++) {
                          const char *pn = property_getName(props[i]);
                          id v = nil;
                          @try { v = [obj valueForKey:[NSString stringWithUTF8String:pn]]; } @catch (NSException *e) {}
                          if (v) [out appendFormat:@"%s=%@;", pn, PDesc(v)];
                      }
                      if (props) free(props);
                      k = class_getSuperclass(k);
                      if (k == [obj class]) break;
                  }
                  LOGE([NSString stringWithFormat:@"%@ %@", tag, out]);
              } @catch (NSException *e) {}
          }
          static void h_yb_loaddata(id self, SEL _cmd) {
              @try {
                  id url = nil, path = nil, img = nil, pdata = nil, extra = nil;
                  @try { url = [self valueForKey:@"imageURL"]; } @catch (NSException *e) {}
                  @try { path = [self valueForKey:@"imagePath"]; } @catch (NSException *e) {}
                  @try { img = [self valueForKey:@"image"]; } @catch (NSException *e) {}
                  @try { pdata = [self valueForKey:@"imageData"]; } @catch (NSException *e) {}
                  @try { extra = [self valueForKey:@"extraData"]; } @catch (NSException *e) {}
                  LOGE([NSString stringWithFormat:@"ybloaddata url=%@ path=%@ img=%@ data=%@ extra=%@",
                      url, path, img ? @"y" : @"n",
                      [pdata isKindOfClass:[NSData class]] ? [NSString stringWithFormat:@"%luB", (unsigned long)[pdata length]] : (pdata ? @"?" : @"nil"),
                      PDesc(extra)]);
                  if (!url) {
                      id msg = nil;
                      if ([extra isKindOfClass:[NSDictionary class]]) msg = [(NSDictionary *)extra objectForKey:@"message"];
                      if (!msg && extra) msg = extra;
                      id cont = nil;
                      if (msg) {
                          DumpProps(msg, @"ybmsg");
                          @try { cont = [msg valueForKey:@"content"]; } @catch (NSException *e) {}
                          if (cont) DumpProps(cont, @"ybcontent");
                      } else {
                          DumpProps(self, @"ybsrc-self");
                      }
                      // ---- 修复: size=0 导致 imageURL 未构建, 从 remoteUrl 现场拼绝对地址 ----
                      NSString *rurl = nil;
                      if (cont) { @try { rurl = [cont valueForKey:@"remoteUrl"]; } @catch (NSException *e) {} }
                      if ([rurl isKindOfClass:[NSString class]] && [rurl hasPrefix:@"file/preview/"]) {
                          NSString *key = [rurl substringFromIndex:13];
                          NSString *full = [NSString stringWithFormat:@"http://101.35.120.27:8090/milo/%@", key];
                          NSURL *absu = [NSURL URLWithString:full];
                          if (absu) {
                              @try {
                                  [self setValue:absu forKey:@"imageURL"];
                                  LOGE([NSString stringWithFormat:@"ybfixed imageURL=%@", full]);
                              } @catch (NSException *e) { LOGE([NSString stringWithFormat:@"ybfixed set-img-fail %@", e]); }
                              id vurl = nil;
                              @try { vurl = [self valueForKey:@"videoURL"]; } @catch (NSException *e) {}
                              if (!vurl) {
                                  @try {
                                      [self setValue:absu forKey:@"videoURL"];
                                      LOGE([NSString stringWithFormat:@"ybfixed videoURL=%@", full]);
                                  } @catch (NSException *e2) {}
                              }
                          }
                      } else {
                          LOGE([NSString stringWithFormat:@"ybfixed skip rurl=%@", rurl]);
                      }
                  }
              } @catch (NSException *e) { LOGE([NSString stringWithFormat:@"ybloaddata err %@", e]); }
              o_yb_loaddata(self, _cmd);
          }
