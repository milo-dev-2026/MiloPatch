                  @try { url = [self valueForKey:@"imageURL"]; } @catch (NSException *e) {}
                  @try { path = [self valueForKey:@"imagePath"]; } @catch (NSException *e) {}
                  @try { img = [self valueForKey:@"image"]; } @catch (NSException *e) {}
                  @try { pdata = [self valueForKey:@"imageData"]; } @catch (NSException *e) {}
                  @try { extra = [self valueForKey:@"extraData"]; } @catch (NSException *e) {}
                  LOGE([NSString stringWithFormat:@"ybloaddata url=%@ path=%@ img=%@ data=%@ extra=%@",
                      url, path, img ? @"y" : @"n",
                      [pdata isKindOfClass:[NSData class]] ? [NSString stringWithFormat:@"%luB", (unsigned long)[pdata length]] : (pdata ? @"?" : @"nil"),
                      PDesc(extra)]);
                  if (!url) {
                      id msg = nil;
                      if ([extra isKindOfClass:[NSDictionary class]]) msg = [(NSDictionary *)extra objectForKey:@"message"];
                      if (!msg && extra) msg = extra;
                      id cont = nil;
                      if (msg) {
                          DumpProps(msg, @"ybmsg");
                          @try { cont = [msg valueForKey:@"content"]; } @catch (NSException *e) {}
                          if (cont) DumpProps(cont, @"ybcontent");
                      } else {
                          DumpProps(self, @"ybsrc-self");
